name: Publish Shuvpi

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v1.0.0)'
        required: true
        type: string
      source_ref:
        description: 'Source ref for recovery; package version must match the release tag'
        required: false
        type: string

permissions: {}

concurrency:
  group: shuvpi-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

# CI publishes the npm CLI closure. The six-platform binary builder remains in
# scripts/build-binaries.sh; release:local validates Node and Bun outside the repo.
jobs:
  publish-npm:
    if: github.repository == 'shuv1337/shuvpi'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Verify release identity and version
        run: node scripts/check-release-target.mjs

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build selected production packages
        run: node scripts/build-release-packages.mjs

      - name: Check
        run: npm run check

      - name: Test without provider e2e activation
        run: ./test.sh

      - name: Smoke-test packed npm consumer
        run: npm run check:package-install

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.16.0 --ignore-scripts

      - name: Publish npm packages idempotently through OIDC
        run: node scripts/publish.mjs

  publish-github-release:
    runs-on: ubuntu-latest
    needs: publish-npm
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created }}
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Publish GitHub release after npm succeeds
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/check-release-target.mjs
          version="${RELEASE_TAG#v}"
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          if [ "$version" = '1.0.0' ]; then
            cp release-notes/1.0.0.md "$notes_file"
          else
            node scripts/release-notes.mjs extract --version "$version" --tag "$RELEASE_TAG" --repo "$GH_REPO" --out "$notes_file"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'created=false' >> "$GITHUB_OUTPUT"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$notes_file" --target "$(git rev-parse HEAD)"
            echo 'created=true' >> "$GITHUB_OUTPUT"
          fi

  notify-discord:
    runs-on: ubuntu-latest
    needs: publish-github-release
    if: needs.publish-github-release.outputs.created == 'true'
    continue-on-error: true
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout notifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Announce the published release once
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: node scripts/notify-discord-release.mjs "$RELEASE_TAG"
