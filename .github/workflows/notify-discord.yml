name: notify-discord

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to post"
        required: true
        type: string

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release events check out the tag, which can predate this script.
          # The workflow file itself comes from the default branch.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.sha }}
          persist-credentials: false

      - id: release
        name: Load release for a manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          name="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name --jq .name)"
          url="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          delimiter="release-notes-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "name=$name"
            echo "url=$url"
            echo "body<<$delimiter"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Post release notes to Discord
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          DISCORD_RELEASE_NAME: ${{ github.event.release.name || steps.release.outputs.name }}
          DISCORD_RELEASE_BODY: ${{ github.event.release.body || steps.release.outputs.body }}
          DISCORD_RELEASE_URL: ${{ github.event.release.html_url || steps.release.outputs.url }}
        run: node scripts/post-github-release-discord.mjs
